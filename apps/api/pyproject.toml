[project]
name = "clipforge-api"
version = "0.1.0"
description = "Backend API for ClipForge — auto-create clips from streams."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ClipForge Team"},
]
readme = "README.md"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
